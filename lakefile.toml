name = "xmss-asm"
version = "0.1.0"
# `XmssAsmTools` is here so that a syntax error in the tooling fails the
# ordinary build.
defaultTargets = ["XmssAsm", "XmssAsmTools", "XmssAsmTests"]
# Generated bytecode modules are deep terms; mirror riscv-zkvm's own setting.
moreLeanArgs = ["--tstack=400000"]

# ---------------------------------------------------------------------------
# The machine side. Every pin below is Lean v4.33.0.
# ---------------------------------------------------------------------------

# The RV64IM model, program logic and interpreter. `sp1-backend` rather than a
# release tag because `riscv-decomp` requires that branch, and Lake takes one
# revision per package: pinning a tag here would silently override the
# revision `Decomp` was proved against. Reproducibility rests on
# `lake-manifest.json`, which records the resolved sha; only an explicit
# `lake update riscv-zkvm` moves it, and that is a dependency bump.
#
# A branch forfeits the release oleans, so this builds from source. That is
# cheap: our import closure is Rv64 + Rv64.Logic (+ Interpreter), none of which
# import the generated `RiscvZkvm.Sail` tree.
[[require]]
name = "riscv-zkvm"
git = "https://github.com/Verified-zkEVM/riscv-zkvm"
rev = "sp1-backend"

# Myreen-style decompilation into logic (L2): the `∃k` total-correctness
# triple, conditional termination, the fuel-free loop rules, the instruction
# leaves and the byte-region layer, all over an abstract `Stepper`.
[[require]]
name = "riscv-decomp"
git = "https://github.com/dhsorens/riscv-decomp"
rev = "main"

# ---------------------------------------------------------------------------
# The specification side, then Mathlib. ORDER MATTERS here; see `mathlib`.
# ---------------------------------------------------------------------------

# The XMSS specification itself: `XmssSecurity.Scheme` (the scheme) and
# `XmssSecurity.Statement` (SUF-CMA, 127-bit target), from leanVM's monorepo.
# Only `XmssSecurity.Scheme` is imported here, so only it and its VCVio closure
# are built -- not the 49k-line security proof. Pinned by sha to leanVM main of
# 2026-09-14.
[[require]]
name = "xmss-security"
git = "https://github.com/leanEthereum/leanVM"
subDir = "formal/xmss"
rev = "b7a1072565e17a222e31924ff96f79a8e5cab458"

# The spec's hash-oracle framework, and the reason the whole repository fits on
# one toolchain. leanVM's `formal/xmss` pins VCVio at `cbd4144` (Lean v4.31.0);
# this is VCVio's first Lean v4.33.0 commit (2026-08-21, "update to Lean 4.33"),
# whose Mathlib pin is the v4.33.0 tag below. Lake takes the root's revision for
# a package over a dependency's, so `xmss-security`'s own VCVio pin is
# overridden by this one, with a warning.
# Whether `XmssSecurity.Scheme` still elaborates against the newer VCVio is the
# standing risk of this pin. It has, unchanged, since 2026-09-15, and every
# build re-checks it. If a bump ever breaks it, the fallback is zip-2005-asm's
# `spec/` sub-package on the upstream toolchain -- at the cost of a toolchain
# split to reconcile before the top-level theorem can be stated.
# Declared AFTER `xmss-security` so that VCVio's own transitive pins (PolyFun,
# loom2) win over the spec package's older ones; see the ordering note on
# `mathlib` below.
[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCVio.git"
rev = "3ecd5523d5beaa10b026f663174e8b9d9708c24b"

# Mathlib is required DIRECTLY, pinned, and LAST. Directly and pinned because
# `VCVio` wants it transitively and the root's pin is what makes the resolution
# deterministic; v4.33.0 is the tag both resolve to today (sha db584cd6), bump
# them together. LAST because Lake resolves a
# package that no require names -- Batteries, Aesop, Qq, ProofWidgets, ... --
# from the manifest of the LAST dependency that mentions it, and the Mathlib
# cache is only usable when those match Mathlib's own manifest exactly. The
# first attempt had `xmss-security` last and inherited its Lean-4.31-era
# Batteries, which does not compile on 4.33.
# Policy: targeted `import Mathlib.<Module>` only, never `import Mathlib`.
# Run `lake exe cache get` before `lake build`, or the oleans build from source.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.33.0"

# ---------------------------------------------------------------------------
# Our libraries.
# ---------------------------------------------------------------------------

# The project proper: the verifier program, the region contracts and the
# top-level correctness theorem. `XmssAsm.+` picks up new modules without
# listing them.
[[lean_lib]]
name = "XmssAsm"
globs = ["XmssAsm", "XmssAsm.+"]

# Build-time tooling: the axiom gate. Not `Tools` -- a library must not claim a
# generic top-level module name (riscv-decomp learned this the expensive way).
[[lean_lib]]
name = "XmssAsmTools"

# The axiom gate (`scripts/check-axioms.sh`): reads the axioms the kernel
# actually recorded for this repository's own declarations.
[[lean_exe]]
name = "axiomsweep"
root = "XmssAsmTools.AxiomSweep"
supportInterpreter = true

# Statement integrity for the optimization gate (`scripts/accept.sh` step 1):
# prints the elaborated form of the frozen vocabulary, which the script hashes
# against `bench/statement.sha256`.
[[lean_exe]]
name = "statementpin"
root = "XmssAsmTools.StatementPin"
supportInterpreter = true

# The executable checks: test hash, fixtures, differential harness, cycle
# report. Not imported by any theorem.
[[lean_lib]]
name = "XmssAsmTests"

# `scripts/test-differential.sh`: the end-to-end differential corpus and the
# cycle report. Optional argument: the synthetic hash cost (default 1).
[[lean_exe]]
name = "difftest"
root = "XmssAsmTests.Main"

# The cheap tier of the autoresearch harness: interpreter-only filters that
# build without any region proof, so a wrong candidate costs seconds to
# reject. Never a merge gate.
[[lean_exe]]
name = "filter"
root = "XmssAsmTests.Filter"

# The machine-readable metric dump the accept gate compares against
# `bench/baseline.txt`.
[[lean_exe]]
name = "bench"
root = "XmssAsmTests.Bench"

# Region-by-region virtual-cycle breakdown, including the OTS subtotal.
[[lean_exe]]
name = "cycles"
root = "XmssAsmTests.Cycles"
